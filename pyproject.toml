[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schemamigrate-learning-v1"
version = "1.0.0"
description = "A modular PostgreSQL online-column-migration learning prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4", "pglast>=6,<9"]

[project.optional-dependencies]
test = []

[project.scripts]
schemamigrate = "schemamigrate.cli:main"

[tool.setuptools.packages.find]
include = ["schemamigrate*"]

